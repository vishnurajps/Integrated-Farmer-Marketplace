<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Browse Products | IFMAP</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Dashboard CSS -->

    <link
        rel="stylesheet"
        href="../css/dashboard.css">

</head>


<body>


<!-- ================================= -->
<!-- NAVBAR -->
<!-- ================================= -->

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">


        <!-- LOGO -->

        <a
            class="navbar-brand text-white fw-bold"
            href="../index.html">

            🌾 IFMAP

        </a>


        <!-- RIGHT SIDE -->

        <div class="d-flex align-items-center">


            <!-- CART -->

            <a
                href="cart.html"
                class="btn btn-light me-3">

                <i class="bi bi-cart3"></i>

                <span
                    class="badge bg-success"
                    id="cartBadge">

                    0

                </span>

            </a>


            <!-- PROFILE -->

            <a href="buyer-profile.html">

                <img
                    src="../images/profile.png"
                    class="profile-img"
                    alt="Profile">

            </a>


            <!-- USER NAME -->

            <span
                class="text-white ms-2"
                id="userName">

                Buyer

            </span>


        </div>

    </div>

</nav>



<!-- ================================= -->
<!-- DASHBOARD -->
<!-- ================================= -->

<div class="dashboard">


    <!-- ================================= -->
    <!-- SIDEBAR -->
    <!-- ================================= -->

    <aside class="sidebar">

        <ul>


            <li>

                <a href="buyer-dashboard.html">

                    <i class="bi bi-speedometer2"></i>

                    Dashboard

                </a>

            </li>


            <li class="active">

                <a href="browse-products.html">

                    <i class="bi bi-shop"></i>

                    Browse Products

                </a>

            </li>


            <li>

                <a href="buyer-orders.html">

                    <i class="bi bi-bag-check"></i>

                    My Orders

                </a>

            </li>


            <li>

                <a href="cart.html">

                    <i class="bi bi-cart3"></i>

                    My Cart

                </a>

            </li>


            <li>

                <a href="buyer-notifications.html">

                    <i class="bi bi-bell"></i>

                    Notifications

                </a>

            </li>


            <li>

                <a href="buyer-profile.html">

                    <i class="bi bi-person"></i>

                    Profile

                </a>

            </li>


            <li>

                <a
                    href="#"
                    id="logoutButton">

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </a>

            </li>


        </ul>

    </aside>



    <!-- ================================= -->
    <!-- MAIN CONTENT -->
    <!-- ================================= -->

    <main class="content">


        <!-- PAGE TITLE -->

        <div
            class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2>🌾 Browse Fresh Products</h2>

                <p class="text-muted">

                    Buy fresh agricultural products directly from farmers.

                </p>

            </div>

        </div>



        <!-- ================================= -->
        <!-- SEARCH AND FILTER -->
        <!-- ================================= -->

        <div class="row mb-4">


            <!-- SEARCH -->

            <div class="col-md-6 mb-2">

                <input
                    type="text"
                    id="searchProduct"
                    class="form-control"
                    placeholder="🔍 Search products...">

            </div>



            <!-- CATEGORY FILTER -->

            <div class="col-md-3 mb-2">

                <select
                    id="categoryFilter"
                    class="form-select">

                    <option value="All">

                        All Categories

                    </option>

                    <option value="Vegetable">

                        Vegetable

                    </option>

                    <option value="Fruit">

                        Fruit

                    </option>

                    <option value="Grains">

                        Grains

                    </option>

                    <option value="Pulses">

                        Pulses

                    </option>

                    <option value="Flowers">

                        Flowers

                    </option>

                    <option value="Spices">

                        Spices

                    </option>

                </select>

            </div>



            <!-- CLEAR -->

            <div class="col-md-3 mb-2">

                <button
                    id="clearFilters"
                    class="btn btn-outline-secondary w-100">

                    <i class="bi bi-x-circle"></i>

                    Clear Filters

                </button>

            </div>


        </div>



        <!-- ================================= -->
        <!-- PRODUCT COUNT -->
        <!-- ================================= -->

        <p class="text-muted">

            <span id="resultCount">0</span>

            products found

        </p>



        <!-- ================================= -->
        <!-- PRODUCTS -->
        <!-- ================================= -->

        <div
            class="row"
            id="productContainer">


            <!-- Loading -->

            <div class="col-12 text-center">

                <p class="text-muted">

                    Loading products...

                </p>

            </div>


        </div>


    </main>

</div>



<!-- ================================= -->
<!-- JAVASCRIPT -->
<!-- ================================= -->

<script src="../js/browse-products.js"></script>


</body>

</html>
