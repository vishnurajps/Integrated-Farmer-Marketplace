<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details | IFMAP</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="../css/product-details.css"
    >

</head>


<body>


<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">

        <a
            class="navbar-brand text-white fw-bold"
            href="buyer-marketplace.html"
        >

            🌾 IFMAP

        </a>


        <span class="text-white">

            Product Details

        </span>


        <button
            class="btn btn-light"
            onclick="goBack()"
        >

            <i class="bi bi-arrow-left"></i>

            Back

        </button>

    </div>

</nav>



<!-- ========================= -->
<!-- PRODUCT DETAILS -->
<!-- ========================= -->

<div class="container mt-5 mb-5">


    <!-- Loading -->

    <div
        id="loadingContainer"
        class="text-center py-5"
    >

        <div
            class="spinner-border text-success"
            role="status"
        ></div>


        <p class="mt-3">

            Loading product details...

        </p>

    </div>



    <!-- Error -->

    <div
        id="errorContainer"
        class="d-none"
    ></div>



    <!-- Product -->

    <div
        id="productDetails"
        class="d-none"
    >

        <div class="card shadow product-card">

            <div class="row g-0">


                <!-- ========================= -->
                <!-- PRODUCT IMAGE -->
                <!-- ========================= -->

                <div class="col-lg-5">

                    <img
                        id="productImage"
                        src="../images/no-image.png"
                        class="img-fluid product-image w-100"
                        alt="Product Image"
                        style="
                            height: 400px;
                            object-fit: cover;
                        "
                    >

                </div>



                <!-- ========================= -->
                <!-- PRODUCT INFORMATION -->
                <!-- ========================= -->

                <div class="col-lg-7">

                    <div class="card-body p-4">


                        <!-- Product Name -->

                        <h2 id="productName">

                            Product Name

                        </h2>



                        <!-- Availability -->

                        <span
                            id="productStatus"
                            class="badge bg-success mb-3"
                        >

                            Available

                        </span>



                        <!-- Price -->

                        <h3
                            id="productPrice"
                            class="text-success mb-4"
                        >

                            ₹0 / Unit

                        </h3>



                        <!-- DETAILS TABLE -->

                        <table
                            class="
                                table
                                table-borderless
                            "
                        >

                            <tbody>


                                <tr>

                                    <td>

                                        <strong>

                                            Category

                                        </strong>

                                    </td>

                                    <td id="productCategory">

                                        -

                                    </td>

                                </tr>



                                <tr>

                                    <td>

                                        <strong>

                                            Available Quantity

                                        </strong>

                                    </td>

                                    <td id="productQuantity">

                                        -

                                    </td>

                                </tr>



                                <tr>

                                    <td>

                                        <strong>

                                            Harvest Date

                                        </strong>

                                    </td>

                                    <td id="productHarvestDate">

                                        -

                                    </td>

                                </tr>



                                <tr>

                                    <td>

                                        <strong>

                                            Location

                                        </strong>

                                    </td>

                                    <td id="productLocation">

                                        -

                                    </td>

                                </tr>



                                <tr>

                                    <td>

                                        <strong>

                                            Farmer

                                        </strong>

                                    </td>

                                    <td id="farmerName">

                                        -

                                    </td>

                                </tr>


                            </tbody>

                        </table>



                        <!-- DESCRIPTION -->

                        <h5 class="mt-4">

                            Description

                        </h5>


                        <p
                            id="productDescription"
                            class="text-muted"
                        >

                            No description available.

                        </p>



                        <!-- ACTIONS -->

                        <!-- ========================= -->
<!-- ORDER QUANTITY -->
<!-- ========================= -->

<div class="mt-4 mb-3">

    <label
        for="orderQuantity"
        class="form-label fw-bold"
    >

        Order Quantity

    </label>


    <div class="input-group" style="max-width: 250px;">

        <button
            class="btn btn-outline-secondary"
            type="button"
            id="decreaseQuantity"
        >

            -

        </button>


        <input
            type="number"
            id="orderQuantity"
            class="form-control text-center"
            min="1"
            value="1"
        >


        <button
            class="btn btn-outline-secondary"
            type="button"
            id="increaseQuantity"
        >

            +

        </button>

    </div>

</div>



<!-- ========================= -->
<!-- ACTIONS -->
<!-- ========================= -->

<div class="mt-4">


    <!-- BUY NOW -->

    <button
        class="btn btn-success"
        id="buyNowButton"
    >

        <i class="bi bi-cart-fill"></i>

        Buy Now

    </button>



    <!-- CONTACT FARMER -->

    <button
        class="btn btn-outline-primary"
        id="contactFarmerButton"
    >

        <i class="bi bi-person-lines-fill"></i>

        Contact Farmer

    </button>



    <!-- BACK TO MARKETPLACE -->

    <a
        href="buyer-marketplace.html"
        class="btn btn-secondary"
    >

        <i class="bi bi-arrow-left"></i>

        Marketplace

    </a>


</div>


                    </div>

                </div>


            </div>

        </div>

    </div>


</div>



<!-- JAVASCRIPT -->

<script src="../js/product-details.js"></script>


</body>

</html>
