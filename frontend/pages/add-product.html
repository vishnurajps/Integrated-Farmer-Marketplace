<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | IFMAP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/add-product.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">

        <a href="farmer-dashboard.html"
           class="navbar-brand text-white fw-bold">

            🌾 IFMAP

        </a>

        <span class="text-white">

            Add Product

        </span>

    </div>

</nav>


<div class="dashboard">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <ul>

            <li>
                <a href="farmer-dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="my-products.html">
                    <i class="bi bi-box-seam"></i>
                    My Products
                </a>
            </li>

            <li class="active">
                <a href="add-product.html">
                    <i class="bi bi-plus-circle"></i>
                    Add Product
                </a>
            </li>

            <li>
                <a href="orders.html">
                    <i class="bi bi-bag"></i>
                    Orders
                </a>
            </li>

            <li>
                <a href="earnings.html">
                    <i class="bi bi-cash-stack"></i>
                    Earnings
                </a>
            </li>

            <li>
                <a href="notifications.html">
                    <i class="bi bi-bell"></i>
                    Notifications
                </a>
            </li>

            <li>
                <a href="profile.html">
                    <i class="bi bi-person"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="login.html">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="content">

        <h2 class="mb-4">

            🌾 Add New Product

        </h2>


        <form id="productForm">

            <div class="row">


                <!-- PRODUCT NAME -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Product Name

                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter product name"
                        required>

                </div>


                <!-- CATEGORY -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Category

                    </label>

                    <select
                        id="category"
                        class="form-select"
                        required>

                        <option value="">

                            Select Category

                        </option>

                        <option>Vegetable</option>

                        <option>Fruit</option>

                        <option>Grains</option>

                        <option>Pulses</option>

                        <option>Flowers</option>

                        <option>Spices</option>

                    </select>

                </div>


                <!-- QUANTITY -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Quantity

                    </label>

                    <input
                        type="number"
                        id="quantity"
                        class="form-control"
                        required>

                </div>


                <!-- UNIT -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Unit

                    </label>

                    <select
                        id="unit"
                        class="form-select"
                        required>

                        <option>Kg</option>

                        <option>Ton</option>

                        <option>Dozen</option>

                        <option>Liter</option>

                        <option>Bag</option>

                    </select>

                </div>


                <!-- PRICE -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Price (₹)

                    </label>

                    <input
                        type="number"
                        id="price"
                        class="form-control"
                        required>

                </div>


                <!-- HARVEST DATE -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Harvest Date

                    </label>

                    <input
                        type="date"
                        id="harvestDate"
                        class="form-control">

                </div>


                <!-- LOCATION -->

                <div class="col-md-12 mb-3">

                    <label class="form-label">

                        Farm Location

                    </label>

                    <input
                        type="text"
                        id="location"
                        class="form-control"
                        placeholder="Village / District">

                </div>


                <!-- DESCRIPTION -->

                <div class="col-md-12 mb-3">

                    <label class="form-label">

                        Product Description

                    </label>

                    <textarea
                        id="description"
                        class="form-control"
                        rows="4"></textarea>

                </div>


                <!-- AVAILABILITY -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Availability

                    </label>

                    <select
                        id="availability"
                        class="form-select">

                        <option>Available</option>

                        <option>Out of Stock</option>

                    </select>

                </div>


                <!-- IMAGE URL -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Product Image URL

                    </label>

                    <input
                        type="text"
                        id="imageUrl"
                        class="form-control"
                        placeholder="Paste any image URL">

                </div>


                <!-- IMAGE PREVIEW -->

                <div class="col-md-12 text-center">

                    <img
                        id="preview"
                        src="../images/no-image.png"
                        class="preview-img"
                        alt="Product Preview">

                </div>


            </div>


            <!-- BUTTONS -->

            <div class="mt-4">

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Add Product

                </button>


                <button
                    type="reset"
                    class="btn btn-secondary ms-2">

                    Reset

                </button>

            </div>


        </form>

    </main>

</div>
<li>

    <a href="#" onclick="logout()">

        <i class="bi bi-box-arrow-right"></i>

        Logout

    </a>

</li>

<script src="../js/add-product.js"></script>

</body>

</html>
