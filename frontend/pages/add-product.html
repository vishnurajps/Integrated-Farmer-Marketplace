<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product | IFMAP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/add-product.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<nav class="navbar dashboard-navbar">

<div class="container-fluid">

<a class="navbar-brand text-white fw-bold">
🌾 IFMAP
</a>

<span class="text-white">Add Product</span>

</div>

</nav>

<div class="dashboard">

<aside class="sidebar">

<ul>

<li><i class="bi bi-speedometer2"></i> Dashboard</li>

<li><i class="bi bi-box-seam"></i> My Products</li>

<li class="active"><i class="bi bi-plus-circle"></i> Add Product</li>

<li><i class="bi bi-bag"></i> Orders</li>

<li><i class="bi bi-cash-stack"></i> Earnings</li>

<li><i class="bi bi-bell"></i> Notifications</li>

<li><i class="bi bi-person"></i> Profile</li>

<li><i class="bi bi-box-arrow-right"></i> Logout</li>

</ul>

</aside>

<main class="content">

<h2 class="mb-4">🌾 Add New Product</h2>

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Product Name</label>

<input type="text" class="form-control" placeholder="Enter product name">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Category</label>

<select class="form-select">

<option>Select Category</option>

<option>Vegetable</option>

<option>Fruit</option>

<option>Grains</option>

<option>Pulses</option>

<option>Flowers</option>

<option>Spices</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Quantity</label>

<input type="number" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Unit</label>

<select class="form-select">

<option>Kg</option>

<option>Ton</option>

<option>Dozen</option>

<option>Liter</option>

<option>Bag</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Price (₹)</label>

<input type="number" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Harvest Date</label>

<input type="date" class="form-control">

</div>

<div class="col-md-12 mb-3">

<label class="form-label">Farm Location</label>

<input type="text" class="form-control" placeholder="Village / District">

</div>

<div class="col-md-12 mb-3">

<label class="form-label">Product Description</label>

<textarea class="form-control" rows="4"></textarea>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Availability</label>

<select class="form-select">

<option>Available</option>

<option>Out of Stock</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Product Image</label>

<input type="file" class="form-control" id="imageInput" accept="image/*">

</div>

<div class="col-md-12 text-center">

<img id="preview"
src="../images/no-image.png"
class="preview-img">

</div>

</div>

<div class="mt-4">

<button class="btn btn-success">

<i class="bi bi-check-circle"></i>

Add Product

</button>

<button type="reset" class="btn btn-secondary ms-2">

Reset

</button>

</div>

</form>

</main>

</div>

<script src="../js/add-product.js"></script>

</body>

</html>
