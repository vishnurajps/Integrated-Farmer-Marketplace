<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Farmer Orders | IFMAP</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Dashboard CSS -->

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

</head>


<body>


<!-- ========================================== -->
<!-- NAVBAR -->
<!-- ========================================== -->

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">


        <!-- LOGO -->

        <a
            class="navbar-brand text-white fw-bold"
            href="../index.html"
        >

            🌾 IFMAP

        </a>



        <!-- FARMER NAME + LOGOUT -->

        <div class="d-flex align-items-center">


            <span
                class="text-white me-3"
                id="farmerName"
            >

                Farmer

            </span>


            <button
                class="btn btn-light"
                id="logoutButton"
            >

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </button>


        </div>


    </div>

</nav>



<!-- ========================================== -->
<!-- MAIN CONTAINER -->
<!-- ========================================== -->

<div class="container-fluid">


    <div class="row">


        <!-- ========================================== -->
        <!-- SIDEBAR -->
        <!-- ========================================== -->

        <div
            class="col-md-3 col-lg-2 p-0"
        >


            <div class="sidebar p-3">


                <h5 class="text-white mb-4">

                    Farmer Menu

                </h5>



                <!-- DASHBOARD -->

                <a
                    href="farmer-dashboard.html"
                    class="sidebar-link"
                >

                    <i class="bi bi-speedometer2"></i>

                    Dashboard

                </a>



                <!-- MY PRODUCTS -->

                <a
                    href="farmer-products.html"
                    class="sidebar-link"
                >

                    <i class="bi bi-basket"></i>

                    My Products

                </a>



                <!-- ADD PRODUCT -->

                <a
                    href="add-product.html"
                    class="sidebar-link"
                >

                    <i class="bi bi-plus-circle"></i>

                    Add Product

                </a>



                <!-- ORDERS -->

                <a
                    href="farmer-orders.html"
                    class="sidebar-link active"
                >

                    <i class="bi bi-cart-check"></i>

                    Orders

                </a>


                <hr class="text-white">


                <!-- LOGOUT -->

                <a
                    href="#"
                    class="sidebar-link"
                    id="sidebarLogout"
                >

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </a>


            </div>


        </div>



        <!-- ========================================== -->
        <!-- MAIN CONTENT -->
        <!-- ========================================== -->

        <main
            class="col-md-9 col-lg-10 p-4"
        >


            <!-- PAGE TITLE -->

            <div class="mb-4">


                <h2>

                    <i class="bi bi-cart-check"></i>

                    Orders Received

                </h2>


                <p class="text-muted">

                    Manage orders placed by buyers for your products.

                </p>


            </div>



            <!-- ========================================== -->
            <!-- ORDER SUMMARY -->
            <!-- ========================================== -->

            <div class="row mb-4">


                <!-- TOTAL -->

                <div class="col-md-4 mb-3">

                    <div class="card shadow-sm">

                        <div class="card-body">


                            <h6 class="text-muted">

                                Total Orders

                            </h6>


                            <h2
                                id="totalOrders"
                                class="text-primary"
                            >

                                0

                            </h2>


                        </div>

                    </div>

                </div>



                <!-- PENDING -->

                <div class="col-md-4 mb-3">

                    <div class="card shadow-sm">

                        <div class="card-body">


                            <h6 class="text-muted">

                                Pending Orders

                            </h6>


                            <h2
                                id="pendingOrders"
                                class="text-warning"
                            >

                                0

                            </h2>


                        </div>

                    </div>

                </div>



                <!-- COMPLETED -->

                <div class="col-md-4 mb-3">

                    <div class="card shadow-sm">

                        <div class="card-body">


                            <h6 class="text-muted">

                                Completed Orders

                            </h6>


                            <h2
                                id="completedOrders"
                                class="text-success"
                            >

                                0

                            </h2>


                        </div>

                    </div>

                </div>


            </div>



            <!-- ========================================== -->
            <!-- ORDERS TABLE -->
            <!-- ========================================== -->

            <div class="card shadow-sm">


                <div class="card-header bg-white">


                    <h5 class="mb-0">

                        All Orders

                    </h5>


                </div>



                <div class="card-body p-0">


                    <div class="table-responsive">


                        <table
                            class="table table-hover mb-0"
                        >


                            <thead class="table-light">


                                <tr>


                                    <th>

                                        Order ID

                                    </th>


                                    <th>

                                        Product

                                    </th>


                                    <th>

                                        Buyer

                                    </th>


                                    <th>

                                        Quantity

                                    </th>


                                    <th>

                                        Total Price

                                    </th>


                                    <th>

                                        Order Date

                                    </th>


                                    <th>

                                        Status

                                    </th>


                                </tr>


                            </thead>



                            <tbody
                                id="ordersTableBody"
                            >


                                <tr>

                                    <td
                                        colspan="7"
                                        class="text-center p-4"
                                    >

                                        Loading orders...

                                    </td>

                                </tr>


                            </tbody>


                        </table>


                    </div>


                </div>


            </div>


        </main>


    </div>


</div>



<!-- ========================================== -->
<!-- JAVASCRIPT -->
<!-- ========================================== -->

<script src="../js/farmer-orders.js"></script>


</body>

</html>
