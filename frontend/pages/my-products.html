<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Products | IFMAP</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../css/dashboard.css">

    <link
        rel="stylesheet"
        href="../css/my-products.css">

</head>


<body>


<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">

        <a
            class="navbar-brand text-white fw-bold"
            href="farmer-dashboard.html">

            🌾 IFMAP

        </a>


        <span class="text-white fw-semibold">

            My Products

        </span>

    </div>

</nav>



<div class="dashboard">


    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside class="sidebar">

        <ul>


            <!-- Dashboard -->

            <li>

                <a href="farmer-dashboard.html">

                    <i class="bi bi-speedometer2"></i>

                    Dashboard

                </a>

            </li>



            <!-- My Products -->

            <li class="active">

                <a href="my-products.html">

                    <i class="bi bi-box-seam"></i>

                    My Products

                </a>

            </li>



            <!-- Add Product -->

            <li>

                <a href="add-product.html">

                    <i class="bi bi-plus-circle"></i>

                    Add Product

                </a>

            </li>



            <!-- Orders -->

            <li>

                <a href="orders.html">

                    <i class="bi bi-bag"></i>

                    Orders

                </a>

            </li>



            <!-- Earnings -->

            <li>

                <a href="earnings.html">

                    <i class="bi bi-cash-stack"></i>

                    Earnings

                </a>

            </li>



            <!-- Notifications -->

            <li>

                <a href="notifications.html">

                    <i class="bi bi-bell"></i>

                    Notifications

                </a>

            </li>



            <!-- Profile -->

            <li>

                <a href="profile.html">

                    <i class="bi bi-person"></i>

                    Profile

                </a>

            </li>



            <!-- Logout -->

            <li>

                <a
                    href="#"
                    onclick="logout(); return false;">

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </a>

            </li>


        </ul>

    </aside>



    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->

    <main class="content">


        <!-- ========================= -->
        <!-- PAGE HEADER -->
        <!-- ========================= -->

        <div
            class="d-flex justify-content-between align-items-center mb-2">

            <div>

                <h2>

                    🌾 My Products

                </h2>

                <p class="text-muted">

                    Manage your agricultural products

                </p>

            </div>


            <button
                class="btn btn-success"
                onclick="window.location.href='add-product.html'">

                <i class="bi bi-plus-circle"></i>

                Add Product

            </button>

        </div>



        <!-- ========================= -->
        <!-- SEARCH AND FILTER -->
        <!-- ========================= -->

        <div class="row mb-4">


            <!-- Search -->

            <div class="col-md-6 mb-2">

                <input
                    type="text"
                    class="form-control"
                    id="searchProduct"
                    placeholder="Search Product">

            </div>



            <!-- Category -->

            <div class="col-md-3 mb-2">

                <select
                    class="form-select"
                    id="categoryFilter">

                    <option value="All">

                        All Categories

                    </option>

                    <option value="Vegetable">

                        Vegetable

                    </option>

                    <option value="Fruit">

                        Fruit

                    </option>

                    <option value="Grains">

                        Grains

                    </option>

                    <option value="Pulses">

                        Pulses

                    </option>

                    <option value="Flowers">

                        Flowers

                    </option>

                    <option value="Spices">

                        Spices

                    </option>

                </select>

            </div>


        </div>



        <!-- ========================= -->
        <!-- PRODUCTS TABLE -->
        <!-- ========================= -->

        <div class="table-responsive">

            <table
                class="table table-bordered table-hover align-middle">


                <!-- TABLE HEADER -->

                <thead class="table-success">

                    <tr>

                        <th>Image</th>

                        <th>Product</th>

                        <th>Category</th>

                        <th>Quantity</th>

                        <th>Price</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>



                <!-- TABLE BODY -->

                <tbody id="productTableBody">

                    <tr>

                        <td
                            colspan="7"
                            class="text-center text-muted">

                            Loading products...

                        </td>

                    </tr>

                </tbody>


            </table>

        </div>


    </main>


</div>



<!-- JavaScript -->

<script src="../js/my-products.js"></script>


</body>

</html>
