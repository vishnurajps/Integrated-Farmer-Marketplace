<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products | IFMAP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/my-products.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">

        <a class="navbar-brand text-white fw-bold">
            🌾 IFMAP
        </a>

        <span class="text-white fw-semibold">
            My Products
        </span>

    </div>

</nav>

<div class="dashboard">

    <aside class="sidebar">

    <ul>

        <li>
            <a href="farmer-dashboard.html">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>
        </li>

        <li class="active">
            <a href="my-products.html">
                <i class="bi bi-box-seam"></i>
                My Products
            </a>
        </li>

        <li>
            <a href="add-product.html" class="btn btn-success">

    <i class="bi bi-plus-circle"></i>

    Add Product

</a>
        </li>

        <li>
            <a href="orders.html">
                <i class="bi bi-bag"></i>
                Orders
            </a>
        </li>

        <li>
            <a href="earnings.html">
                <i class="bi bi-cash-stack"></i>
                Earnings
            </a>
        </li>

        <li>
            <a href="notifications.html">
                <i class="bi bi-bell"></i>
                Notifications
            </a>
        </li>

        <li>
            <a href="profile.html">
                <i class="bi bi-person"></i>
                Profile
            </a>
        </li>

        <li>
            <a href="../index.html">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>
        </li>

    </ul>

</aside>

    <main class="content">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>🌾 My Products</h2>

          <button
    class="btn btn-success"
    onclick="window.location.href='add-product.html'">

    <i class="bi bi-plus-circle"></i>
    Add Product

</button>

        </div>

        <div class="row mb-4">

            <div class="col-md-6">

                <input type="text"
       class="form-control"
       id="searchProduct"
       placeholder="Search Product">

            </div>

            <div class="col-md-3">

                <select class="form-select" id="categoryFilter">

    <option value="All">All Categories</option>

    <option value="Vegetable">Vegetable</option>

    <option value="Fruit">Fruit</option>

    <option value="Grains">Grains</option>

    <option value="Pulses">Pulses</option>

    <option value="Flowers">Flowers</option>

    <option value="Spices">Spices</option>

</select>

            </div>

        </div>

        <table class="table table-bordered table-hover align-middle">

    <thead class="table-success">

        <tr>

            <th>Image</th>

            <th>Product</th>

            <th>Category</th>

            <th>Quantity</th>

            <th>Price</th>

            <th>Status</th>

            <th>Action</th>

        </tr>

    </thead>


    <tbody id="productTableBody">

    </tbody>

</table>

    </main>

</div>
<script src="../js/my-products.js"></script>
</body>

</html>
