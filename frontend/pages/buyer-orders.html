<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders | IFMAP</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Dashboard CSS -->

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

</head>


<body>


<!-- ========================================== -->
<!-- TOP NAVBAR -->
<!-- ========================================== -->

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">

        <!-- Logo -->

        <a
            class="navbar-brand text-white fw-bold"
            href="buyer-dashboard.html"
        >

            🌾 IFMAP

        </a>


        <!-- User Section -->

        <div class="d-flex align-items-center">

            <span
                class="text-white me-3 fw-semibold"
                id="buyerName"
            >

                Buyer

            </span>


            <button
                class="btn btn-light"
                id="logoutButton"
            >

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </button>

        </div>

    </div>

</nav>



<!-- ========================================== -->
<!-- DASHBOARD LAYOUT -->
<!-- ========================================== -->

<div class="dashboard">


    <!-- ========================================== -->
    <!-- SIDEBAR -->
    <!-- ========================================== -->

    <aside class="sidebar">

        <ul>


            <!-- Dashboard -->

            <li>

                <a href="buyer-dashboard.html">

                    <i class="bi bi-speedometer2"></i>

                    Dashboard

                </a>

            </li>


            <!-- Browse Products -->

            <li>

                <a href="buyer-marketplace.html">

                    <i class="bi bi-shop"></i>

                    Browse Products

                </a>

            </li>


            <!-- My Orders -->

            <li class="active">

                <a href="buyer-orders.html">

                    <i class="bi bi-bag-check"></i>

                    My Orders

                </a>

            </li>


            <!-- My Cart -->

            <li>

                <a href="cart.html">

                    <i class="bi bi-cart3"></i>

                    My Cart

                </a>

            </li>


            <!-- Notifications -->

            <li>

                <a href="notifications.html">

                    <i class="bi bi-bell"></i>

                    Notifications

                </a>

            </li>


            <!-- Profile -->

            <li>

                <a href="profile.html">

                    <i class="bi bi-person"></i>

                    Profile

                </a>

            </li>


            <!-- Logout -->

            <li>

                <a
                    href="#"
                    id="sidebarLogout"
                >

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </a>

            </li>


        </ul>

    </aside>



    <!-- ========================================== -->
    <!-- MAIN CONTENT -->
    <!-- ========================================== -->

    <main class="content">


        <!-- PAGE HEADER -->

        <div
            class="
                d-flex
                justify-content-between
                align-items-center
                mb-4
            "
        >


            <div>

                <h2>

                    <i class="bi bi-bag-check"></i>

                    My Orders

                </h2>


                <p class="text-muted mb-0">

                    View and track all your product orders

                </p>

            </div>



            <!-- Continue Shopping -->

            <a
                href="buyer-marketplace.html"
                class="btn btn-success"
            >

                <i class="bi bi-shop"></i>

                Continue Shopping

            </a>


        </div>



        <!-- ========================================== -->
        <!-- ORDERS TABLE -->
        <!-- ========================================== -->

        <div class="card shadow-sm">

            <div class="card-body">


                <!-- Loading -->

                <div
                    id="loadingContainer"
                    class="text-center py-4"
                >

                    <div
                        class="spinner-border text-success"
                    ></div>


                    <p class="mt-2">

                        Loading your orders...

                    </p>

                </div>



                <!-- Orders Table -->

                <div
                    class="table-responsive d-none"
                    id="ordersContainer"
                >

                    <table
                        class="
                            table
                            table-hover
                            align-middle
                        "
                    >


                        <thead class="table-success">

                            <tr>

                                <th>Order ID</th>

                                <th>Product</th>

                                <th>Farmer</th>

                                <th>Quantity</th>

                                <th>Price / Unit</th>

                                <th>Total Price</th>

                                <th>Status</th>

                                <th>Order Date</th>

                            </tr>

                        </thead>



                        <tbody
                            id="ordersTableBody"
                        >

                        </tbody>


                    </table>

                </div>



                <!-- Error Container -->

                <div
                    id="errorContainer"
                    class="d-none"
                >

                </div>



            </div>

        </div>


    </main>


</div>



<!-- ========================================== -->
<!-- JAVASCRIPT -->
<!-- ========================================== -->

<script src="../js/buyer-orders.js"></script>


</body>

</html>
