<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Marketplace | IFMAP</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Dashboard CSS -->

    <link rel="stylesheet"
          href="../css/dashboard.css">

</head>


<body>


<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">

        <a class="navbar-brand text-white fw-bold"
           href="../index.html">

            🌾 IFMAP

        </a>


        <div class="d-flex align-items-center">

            <span class="text-white me-3"
                  id="buyerName">

                Buyer

            </span>


            <button
                class="btn btn-light"
                id="logoutButton">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </button>

        </div>

    </div>

</nav>



<!-- ========================= -->
<!-- MAIN CONTENT -->
<!-- ========================= -->

<div class="container py-4">


    <!-- PAGE TITLE -->

    <div class="mb-4">

        <h2>🛒 Farmer Marketplace</h2>

        <p class="text-muted">

            Fresh agricultural products directly from farmers

        </p>

    </div>



    <!-- ========================= -->
    <!-- SEARCH AND FILTER -->
    <!-- ========================= -->

    <div class="row mb-4">


        <!-- SEARCH -->

        <div class="col-md-8 mb-2">

            <input
                type="text"
                class="form-control"
                id="searchProduct"
                placeholder="Search products...">

        </div>



        <!-- CATEGORY -->

        <div class="col-md-4 mb-2">

            <select
                class="form-select"
                id="categoryFilter">

                <option value="All">

                    All Categories

                </option>

                <option value="Vegetable">

                    Vegetable

                </option>

                <option value="Fruit">

                    Fruit

                </option>

                <option value="Grains">

                    Grains

                </option>

                <option value="Pulses">

                    Pulses

                </option>

                <option value="Flowers">

                    Flowers

                </option>

                <option value="Spices">

                    Spices

                </option>

            </select>

        </div>

    </div>



    <!-- ========================= -->
    <!-- PRODUCTS -->
    <!-- ========================= -->

    <div class="row"
         id="productContainer">


        <div class="col-12 text-center">

            Loading products...

        </div>


    </div>


</div>



<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script src="../js/buyer-marketplace.js"></script>


</body>

</html>
