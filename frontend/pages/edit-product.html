<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <title>Edit Product | IFMAP</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Dashboard CSS -->

    <link
        rel="stylesheet"
        href="../css/dashboard.css">


</head>


<body>


<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">


        <a
            class="navbar-brand text-white fw-bold"
            href="farmer-dashboard.html">

            🌾 IFMAP

        </a>


        <span class="text-white fw-semibold">

            Edit Product

        </span>


    </div>

</nav>



<!-- ========================= -->
<!-- MAIN CONTENT -->
<!-- ========================= -->

<div class="container mt-5 mb-5">


    <div class="card shadow">


        <div class="card-body p-4">


            <!-- TITLE -->

            <div
                class="d-flex
                justify-content-between
                align-items-center
                mb-4">


                <h3>

                    <i class="bi bi-pencil-square"></i>

                    Edit Product

                </h3>


                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="window.location.href='my-products.html'">

                    <i class="bi bi-arrow-left"></i>

                    Back

                </button>


            </div>



            <!-- ========================= -->
            <!-- EDIT FORM -->
            <!-- ========================= -->

            <form id="editProductForm">


                <!-- PRODUCT NAME -->

                <div class="mb-3">

                    <label class="form-label">

                        Product Name

                    </label>


                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter product name"
                        required>

                </div>



                <!-- CATEGORY -->

                <div class="mb-3">

                    <label class="form-label">

                        Category

                    </label>


                    <input
                        type="text"
                        id="category"
                        class="form-control"
                        placeholder="Example: Vegetable"
                        required>

                </div>



                <!-- QUANTITY -->

                <div class="mb-3">

                    <label class="form-label">

                        Quantity

                    </label>


                    <input
                        type="number"
                        id="quantity"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required>

                </div>



                <!-- UNIT -->

                <div class="mb-3">

                    <label class="form-label">

                        Unit

                    </label>


                    <select
                        id="unit"
                        class="form-select"
                        required>

                        <option value="Kg">

                            Kg

                        </option>

                        <option value="Gram">

                            Gram

                        </option>

                        <option value="Piece">

                            Piece

                        </option>

                        <option value="Dozen">

                            Dozen

                        </option>

                        <option value="Ton">

                            Ton

                        </option>

                    </select>

                </div>



                <!-- PRICE -->

                <div class="mb-3">

                    <label class="form-label">

                        Price

                    </label>


                    <input
                        type="number"
                        id="price"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required>

                </div>



                <!-- HARVEST DATE -->

                <div class="mb-3">

                    <label class="form-label">

                        Harvest Date

                    </label>


                    <input
                        type="date"
                        id="harvestDate"
                        class="form-control">

                </div>



                <!-- LOCATION -->

                <div class="mb-3">

                    <label class="form-label">

                        Location

                    </label>


                    <input
                        type="text"
                        id="location"
                        class="form-control"
                        placeholder="Enter location">

                </div>



                <!-- DESCRIPTION -->

                <div class="mb-3">

                    <label class="form-label">

                        Description

                    </label>


                    <textarea
                        id="description"
                        class="form-control"
                        rows="4"
                        placeholder="Enter product description"></textarea>

                </div>



                <!-- AVAILABILITY -->

                <div class="mb-3">

                    <label class="form-label">

                        Availability

                    </label>


                    <select
                        id="availability"
                        class="form-select">

                        <option value="Available">

                            Available

                        </option>


                        <option value="Unavailable">

                            Unavailable

                        </option>

                    </select>

                </div>



                <!-- IMAGE URL -->

                <div class="mb-3">

                    <label class="form-label">

                        Image URL

                    </label>


                    <input
                        type="url"
                        id="imageUrl"
                        class="form-control"
                        placeholder="https://example.com/image.jpg">

                </div>



                <!-- IMAGE PREVIEW -->

                <div class="mb-4">


                    <label class="form-label">

                        Image Preview

                    </label>


                    <br>


                    <img
                        id="preview"
                        src="../images/no-image.png"
                        alt="Product Preview"
                        width="180"
                        height="180"
                        style="
                            object-fit: cover;
                            border-radius: 10px;
                            border: 1px solid #ddd;
                        ">

                </div>



                <!-- BUTTONS -->

                <button
                    type="submit"
                    id="updateButton"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Update Product

                </button>



                <button
                    type="button"
                    class="btn btn-secondary ms-2"
                    onclick="window.location.href='my-products.html'">

                    Cancel

                </button>


            </form>


        </div>


    </div>


</div>



<!-- EDIT PRODUCT JAVASCRIPT -->

<script src="../js/edit-product.js"></script>


</body>

</html>
