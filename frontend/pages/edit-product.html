<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Product | IFMAP</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <link
        rel="stylesheet"
        href="../css/dashboard.css">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">

        <a
            class="navbar-brand text-white fw-bold"
            href="farmer-dashboard.html">

            🌾 IFMAP

        </a>


        <span class="text-white fw-semibold">

            Edit Product

        </span>

    </div>

</nav>



<div class="container mt-5">


    <div class="card shadow">


        <div class="card-body p-4">


            <h3 class="mb-4">

                <i class="bi bi-pencil-square"></i>

                Edit Product

            </h3>



            <form id="editProductForm">


                <!-- Product Name -->

                <div class="mb-3">

                    <label class="form-label">

                        Product Name

                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        required>

                </div>



                <!-- Category -->

                <div class="mb-3">

                    <label class="form-label">

                        Category

                    </label>

                    <input
                        type="text"
                        id="category"
                        class="form-control"
                        required>

                </div>



                <!-- Quantity -->

                <div class="mb-3">

                    <label class="form-label">

                        Quantity

                    </label>

                    <input
                        type="number"
                        id="quantity"
                        class="form-control"
                        step="0.01"
                        required>

                </div>



                <!-- Unit -->

                <div class="mb-3">

                    <label class="form-label">

                        Unit

                    </label>

                    <input
                        type="text"
                        id="unit"
                        class="form-control"
                        required>

                </div>



                <!-- Price -->

                <div class="mb-3">

                    <label class="form-label">

                        Price

                    </label>

                    <input
                        type="number"
                        id="price"
                        class="form-control"
                        step="0.01"
                        required>

                </div>



                <!-- Harvest Date -->

                <div class="mb-3">

                    <label class="form-label">

                        Harvest Date

                    </label>

                    <input
                        type="date"
                        id="harvestDate"
                        class="form-control">

                </div>



                <!-- Location -->

                <div class="mb-3">

                    <label class="form-label">

                        Location

                    </label>

                    <input
                        type="text"
                        id="location"
                        class="form-control">

                </div>



                <!-- Description -->

                <div class="mb-3">

                    <label class="form-label">

                        Description

                    </label>

                    <textarea
                        id="description"
                        class="form-control"
                        rows="3"></textarea>

                </div>



                <!-- Availability -->

                <div class="mb-3">

                    <label class="form-label">

                        Availability

                    </label>

                    <select
                        id="availability"
                        class="form-select">

                        <option value="Available">

                            Available

                        </option>

                        <option value="Unavailable">

                            Unavailable

                        </option>

                    </select>

                </div>



                <!-- Image -->

                <div class="mb-4">

                    <label class="form-label">

                        Image URL

                    </label>

                    <input
                        type="text"
                        id="imageUrl"
                        class="form-control">

                </div>



                <!-- Buttons -->

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Update Product

                </button>


                <button
                    type="button"
                    class="btn btn-secondary ms-2"
                    onclick="window.location.href='my-products.html'">

                    Cancel

                </button>


            </form>


        </div>


    </div>


</div>


<script src="../js/edit-product.js"></script>


</body>

</html>
