<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product | IFMAP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/add-product.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">

        <a href="farmer-dashboard.html"
           class="navbar-brand text-white fw-bold text-decoration-none">

            🌾 IFMAP

        </a>

        <span class="text-white fw-semibold">

            Edit Product

        </span>

    </div>

</nav>


<div class="dashboard">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <ul>

            <li>
                <a href="farmer-dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>


            <li class="active">
                <a href="my-products.html">
                    <i class="bi bi-box-seam"></i>
                    My Products
                </a>
            </li>


            <li>
                <a href="add-product.html">
                    <i class="bi bi-plus-circle"></i>
                    Add Product
                </a>
            </li>


            <li>
                <a href="orders.html">
                    <i class="bi bi-bag"></i>
                    Orders
                </a>
            </li>


            <li>
                <a href="earnings.html">
                    <i class="bi bi-cash-stack"></i>
                    Earnings
                </a>
            </li>


            <li>
                <a href="notifications.html">
                    <i class="bi bi-bell"></i>
                    Notifications
                </a>
            </li>


            <li>
                <a href="profile.html">
                    <i class="bi bi-person"></i>
                    Profile
                </a>
            </li>


            <li>
                <a href="../index.html">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="content">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>✏️ Edit Product</h2>

            <a href="my-products.html"
               class="btn btn-secondary">

                <i class="bi bi-arrow-left"></i>

                Back to Products

            </a>

        </div>


        <form id="editProductForm">

            <div class="row">


                <!-- Product Name -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Product Name

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        required>

                </div>


                <!-- Category -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Category

                    </label>

                    <select
                        class="form-select"
                        id="category"
                        required>

                        <option value="Vegetable">
                            Vegetable
                        </option>

                        <option value="Fruit">
                            Fruit
                        </option>

                        <option value="Grains">
                            Grains
                        </option>

                        <option value="Pulses">
                            Pulses
                        </option>

                        <option value="Flowers">
                            Flowers
                        </option>

                        <option value="Spices">
                            Spices
                        </option>

                    </select>

                </div>


                <!-- Quantity -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Quantity

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="quantity"
                        required>

                </div>


                <!-- Unit -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Unit

                    </label>

                    <select
                        class="form-select"
                        id="unit"
                        required>

                        <option value="Kg">Kg</option>
                        <option value="Ton">Ton</option>
                        <option value="Dozen">Dozen</option>
                        <option value="Liter">Liter</option>
                        <option value="Bag">Bag</option>

                    </select>

                </div>


                <!-- Price -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Price (₹)

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="price"
                        required>

                </div>


                <!-- Harvest Date -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Harvest Date

                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="harvestDate">

                </div>


                <!-- Location -->

                <div class="col-md-12 mb-3">

                    <label class="form-label">

                        Farm Location

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="location">

                </div>


                <!-- Description -->

                <div class="col-md-12 mb-3">

                    <label class="form-label">

                        Product Description

                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        rows="4"></textarea>

                </div>


                <!-- Availability -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Availability

                    </label>

                    <select
                        class="form-select"
                        id="availability">

                        <option value="Available">
                            Available
                        </option>

                        <option value="Out of Stock">
                            Out of Stock
                        </option>

                    </select>

                </div>


                <!-- Image URL -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Image URL

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="imageUrl">

                </div>


            </div>


            <div class="mt-4">

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Update Product

                </button>


                <a href="my-products.html"
                   class="btn btn-secondary ms-2">

                    Cancel

                </a>

            </div>

        </form>

    </main>

</div>


<script src="../js/edit-product.js"></script>

</body>

</html>
