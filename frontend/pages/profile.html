    <ul>

<main class="content">

<h2 class="mb-4">
👤 Farmer Profile
</h2>

<div class="profile-card">

<div class="text-center mb-4">

<img src="../images/profile.png"
class="profile-photo"
alt="Profile">

<h3 class="mt-3">
Vishnu Raj
</h3>

<p class="text-muted">
Farmer
</p>

<button class="btn btn-success mt-2">
<i class="bi bi-camera-fill"></i>
Change Photo
</button>

</div>

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label>Full Name</label>

<input type="text"
class="form-control"
value="Vishnu Raj">

</div>

<div class="col-md-6 mb-3">

<label>Mobile Number</label>

<input type="text"
class="form-control"
value="9876543210">

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input type="email"
class="form-control"
value="vishnu@gmail.com">

</div>

<div class="col-md-6 mb-3">

<label>Role</label>

<input type="text"
class="form-control"
value="Farmer"
readonly>

</div>

<div class="col-md-6 mb-3">

<label>State</label>

<input type="text"
class="form-control"
value="Tamil Nadu">

</div>

<div class="col-md-6 mb-3">

<label>District</label>

<input type="text"
class="form-control"
value="Erode">

</div>

<div class="col-md-12 mb-3">

<label>Address</label>

<textarea class="form-control" rows="3">Gobichettipalayam, Erode</textarea>

</div>

<div class="col-md-6 mb-3">

<label>Farm Name</label>

<input type="text"
class="form-control"
value="Green Valley Farm">

</div>

<div class="col-md-6 mb-3">

<label>Farm Size</label>

<input type="text"
class="form-control"
value="5 Acres">

</div>

<div class="col-md-12 mb-3">

<label>Main Crops</label>

<input type="text"
class="form-control"
value="Tomato, Onion, Banana">

</div>

</div>

<button class="btn btn-success">
<i class="bi bi-save"></i>
Save Changes
</button>

<button class="btn btn-secondary">
Reset
</button>

</form>

</div>

</main>

</div>

<script src="../js/profile.js"></script>
