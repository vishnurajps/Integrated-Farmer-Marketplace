<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Farmer Profile | IFMAP</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../css/dashboard.css">

    <link
        rel="stylesheet"
        href="../css/profile.css">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body>


<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<nav class="navbar dashboard-navbar">

    <div class="container-fluid">

        <a
            class="navbar-brand text-white fw-bold"
            href="farmer-dashboard.html">

            🌾 IFMAP

        </a>


        <span class="text-white">

            My Profile

        </span>

    </div>

</nav>



<div class="dashboard">


<!-- ========================= -->
<!-- SIDEBAR -->
<!-- ========================= -->

<aside class="sidebar">

    <ul>


        <li>

            <a href="farmer-dashboard.html">

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </a>

        </li>


        <li>

            <a href="my-products.html">

                <i class="bi bi-box-seam"></i>

                My Products

            </a>

        </li>


        <li>

            <a href="add-product.html">

                <i class="bi bi-plus-circle"></i>

                Add Product

            </a>

        </li>


        <li>

            <a href="orders.html">

                <i class="bi bi-bag"></i>

                Orders

            </a>

        </li>


        <li>

            <a href="earnings.html">

                <i class="bi bi-cash-stack"></i>

                Earnings

            </a>

        </li>


        <li>

            <a href="notifications.html">

                <i class="bi bi-bell"></i>

                Notifications

            </a>

        </li>


        <li class="active">

            <a href="profile.html">

                <i class="bi bi-person"></i>

                Profile

            </a>

        </li>


        <li>

            <a href="#"
               id="logoutButton">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </a>

        </li>


    </ul>

</aside>



<!-- ========================= -->
<!-- MAIN CONTENT -->
<!-- ========================= -->

<main class="content">


    <h2 class="mb-4">

        👤 Farmer Profile

    </h2>



    <div class="profile-card">


        <!-- ========================= -->
        <!-- PROFILE HEADER -->
        <!-- ========================= -->

        <div class="text-center mb-4">


            <img
                id="profileImage"
                src="../images/profile.png"
                class="profile-photo"
                alt="Profile">


            <h3
                class="mt-3"
                id="profileName">

                Loading...

            </h3>


            <p
                class="text-muted"
                id="profileRole">

                Farmer

            </p>


        </div>



        <!-- ========================= -->
        <!-- PROFILE FORM -->
        <!-- ========================= -->

        <form id="profileForm">


            <div class="row">


                <!-- Full Name -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Full Name

                    </label>


                    <input
                        type="text"
                        id="fullName"
                        class="form-control"
                        required>

                </div>



                <!-- Mobile -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Mobile Number

                    </label>


                    <input
                        type="text"
                        id="mobile"
                        class="form-control"
                        maxlength="10"
                        required>

                </div>



                <!-- Email -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Email

                    </label>


                    <input
                        type="email"
                        id="email"
                        class="form-control">

                </div>



                <!-- Role -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Role

                    </label>


                    <input
                        type="text"
                        id="role"
                        class="form-control"
                        readonly>

                </div>



                <!-- State -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        State

                    </label>


                    <input
                        type="text"
                        id="state"
                        class="form-control"
                        required>

                </div>



                <!-- District -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        District

                    </label>


                    <input
                        type="text"
                        id="district"
                        class="form-control"
                        required>

                </div>



                <!-- Address -->

                <div class="col-md-12 mb-3">

                    <label class="form-label">

                        Address

                    </label>


                    <textarea
                        id="address"
                        class="form-control"
                        rows="3">

                    </textarea>

                </div>


            </div>



            <!-- BUTTONS -->

            <button
                type="submit"
                class="btn btn-success">

                <i class="bi bi-save"></i>

                Save Changes

            </button>



            <button
                type="button"
                id="resetButton"
                class="btn btn-secondary">

                Reset

            </button>


        </form>


    </div>


</main>


</div>



<!-- JAVASCRIPT -->

<script src="../js/profile.js"></script>


</body>

</html>
